<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Pretendard','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#4a9af5"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8901a"/>
      <stop offset="100%" stop-color="#f5b44a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="12" fill="#f8fafd"/>
  <rect x="0" y="0" width="800" height="52" rx="12" fill="#1a1a2e"/>
  <rect x="0" y="40" width="800" height="12" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">공정별 최소 벽 두께 비교 (mm)</text>

  <!-- Legend -->
  <rect x="480" y="68" width="14" height="14" rx="3" fill="url(#barGrad)"/>
  <text x="500" y="80" fill="#555" font-size="13" font-weight="600">지지된 벽</text>
  <rect x="580" y="68" width="14" height="14" rx="3" fill="url(#barGrad2)"/>
  <text x="600" y="80" fill="#555" font-size="13" font-weight="600">독립 벽</text>
  <rect x="670" y="68" width="14" height="14" rx="3" fill="#ddd" stroke="#999" stroke-width="1"/>
  <text x="690" y="80" fill="#555" font-size="13" font-weight="600">권장</text>

  <!-- Grid lines -->
  <line x1="200" y1="95" x2="200" y2="400" stroke="#e0e5ec" stroke-width="1"/>
  <line x1="320" y1="95" x2="320" y2="400" stroke="#e0e5ec" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="440" y1="95" x2="440" y2="400" stroke="#e0e5ec" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="560" y1="95" x2="560" y2="400" stroke="#e0e5ec" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="680" y1="95" x2="680" y2="400" stroke="#e0e5ec" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Axis labels -->
  <text x="200" y="412" text-anchor="middle" fill="#999" font-size="11">0</text>
  <text x="320" y="412" text-anchor="middle" fill="#999" font-size="11">0.5</text>
  <text x="440" y="412" text-anchor="middle" fill="#999" font-size="11">1.0</text>
  <text x="560" y="412" text-anchor="middle" fill="#999" font-size="11">1.5</text>
  <text x="680" y="412" text-anchor="middle" fill="#999" font-size="11">2.0</text>

  <!-- PolyJet -->
  <text x="190" y="122" text-anchor="end" fill="#1a1a2e" font-size="14" font-weight="700">PolyJet</text>
  <rect x="200" y="105" width="48" height="16" rx="4" fill="url(#barGrad)"/>
  <text x="254" y="118" fill="#1a73e8" font-size="12" font-weight="700">0.2</text>
  <rect x="200" y="124" width="96" height="16" rx="4" fill="url(#barGrad2)"/>
  <text x="302" y="137" fill="#e8901a" font-size="12" font-weight="700">0.4</text>
  <rect x="200" y="143" width="144" height="10" rx="3" fill="#ddd" stroke="#bbb" stroke-width="0.5"/>
  <text x="350" y="152" fill="#999" font-size="11">0.6</text>

  <!-- SLA -->
  <text x="190" y="182" text-anchor="end" fill="#1a1a2e" font-size="14" font-weight="700">SLA (레진)</text>
  <rect x="200" y="165" width="72" height="16" rx="4" fill="url(#barGrad)"/>
  <text x="278" y="178" fill="#1a73e8" font-size="12" font-weight="700">0.3</text>
  <rect x="200" y="184" width="120" height="16" rx="4" fill="url(#barGrad2)"/>
  <text x="326" y="197" fill="#e8901a" font-size="12" font-weight="700">0.5</text>
  <rect x="200" y="203" width="192" height="10" rx="3" fill="#ddd" stroke="#bbb" stroke-width="0.5"/>
  <text x="398" y="212" fill="#999" font-size="11">0.8</text>

  <!-- MJF -->
  <text x="190" y="242" text-anchor="end" fill="#1a1a2e" font-size="14" font-weight="700">MJF (PA12)</text>
  <rect x="200" y="225" width="120" height="16" rx="4" fill="url(#barGrad)"/>
  <text x="326" y="238" fill="#1a73e8" font-size="12" font-weight="700">0.5</text>
  <rect x="200" y="244" width="168" height="16" rx="4" fill="url(#barGrad2)"/>
  <text x="374" y="257" fill="#e8901a" font-size="12" font-weight="700">0.7</text>
  <rect x="200" y="263" width="192" height="10" rx="3" fill="#ddd" stroke="#bbb" stroke-width="0.5"/>
  <text x="398" y="272" fill="#999" font-size="11">0.8</text>

  <!-- SLS -->
  <text x="190" y="302" text-anchor="end" fill="#1a1a2e" font-size="14" font-weight="700">SLS (PA12)</text>
  <rect x="200" y="285" width="168" height="16" rx="4" fill="url(#barGrad)"/>
  <text x="374" y="298" fill="#1a73e8" font-size="12" font-weight="700">0.7</text>
  <rect x="200" y="304" width="192" height="16" rx="4" fill="url(#barGrad2)"/>
  <text x="398" y="317" fill="#e8901a" font-size="12" font-weight="700">0.8</text>
  <rect x="200" y="323" width="240" height="10" rx="3" fill="#ddd" stroke="#bbb" stroke-width="0.5"/>
  <text x="446" y="332" fill="#999" font-size="11">1.0</text>

  <!-- FDM ABS -->
  <text x="190" y="362" text-anchor="end" fill="#1a1a2e" font-size="14" font-weight="700">FDM (ABS)</text>
  <rect x="200" y="345" width="192" height="16" rx="4" fill="url(#barGrad)"/>
  <text x="398" y="358" fill="#1a73e8" font-size="12" font-weight="700">0.8</text>
  <rect x="200" y="364" width="288" height="16" rx="4" fill="url(#barGrad2)"/>
  <text x="494" y="377" fill="#e8901a" font-size="12" font-weight="700">1.2</text>
  <rect x="200" y="383" width="360" height="10" rx="3" fill="#ddd" stroke="#bbb" stroke-width="0.5"/>
  <text x="566" y="392" fill="#999" font-size="11">1.5</text>
</svg>