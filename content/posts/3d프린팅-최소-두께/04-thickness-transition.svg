<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="'Pretendard','Malgun Gothic','Noto Sans KR',sans-serif">
  <rect width="800" height="320" rx="12" fill="#f8fafd"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="50" rx="12" fill="#1a1a2e"/>
  <rect x="0" y="38" width="800" height="12" fill="#1a1a2e"/>
  <text x="400" y="33" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">두께 전환 — 나쁜 예 vs 좋은 예</text>

  <!-- LEFT: Bad example -->
  <rect x="30" y="70" width="360" height="230" rx="10" fill="#fff" stroke="#e3ebf5" stroke-width="1.5"/>
  <rect x="30" y="70" width="360" height="36" rx="10" fill="#e84a4a"/>
  <rect x="30" y="96" width="360" height="10" fill="#e84a4a"/>
  <text x="210" y="94" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">✕  급격한 전환</text>

  <!-- Abrupt transition shape -->
  <polygon points="80,250 80,160 220,160 220,130 340,130 340,250" fill="#c8d8ec" stroke="#1a1a2e" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Step highlight -->
  <line x1="220" y1="160" x2="220" y2="130" stroke="#e84a4a" stroke-width="3"/>
  <circle cx="220" cy="145" r="14" fill="none" stroke="#e84a4a" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Dimension labels -->
  <line x1="65" y1="160" x2="65" y2="250" stroke="#666" stroke-width="1"/>
  <line x1="60" y1="160" x2="70" y2="160" stroke="#666" stroke-width="1"/>
  <line x1="60" y1="250" x2="70" y2="250" stroke="#666" stroke-width="1"/>
  <text x="55" y="210" text-anchor="middle" fill="#666" font-size="12" font-weight="600" transform="rotate(-90,55,210)">얇음</text>

  <line x1="355" y1="130" x2="355" y2="250" stroke="#666" stroke-width="1"/>
  <line x1="350" y1="130" x2="360" y2="130" stroke="#666" stroke-width="1"/>
  <line x1="350" y1="250" x2="360" y2="250" stroke="#666" stroke-width="1"/>
  <text x="370" y="195" text-anchor="middle" fill="#666" font-size="12" font-weight="600" transform="rotate(90,370,195)">두꺼움</text>

  <!-- Problem annotation -->
  <text x="210" y="280" text-anchor="middle" fill="#e84a4a" font-size="13" font-weight="700">냉각 속도 차이 → 수축 자국·휨</text>

  <!-- RIGHT: Good example -->
  <rect x="410" y="70" width="360" height="230" rx="10" fill="#fff" stroke="#e3ebf5" stroke-width="1.5"/>
  <rect x="410" y="70" width="360" height="36" rx="10" fill="#1a73e8"/>
  <rect x="410" y="96" width="360" height="10" fill="#1a73e8"/>
  <text x="590" y="94" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">○  점진적 전환 (3:1 이하)</text>

  <!-- Gradual transition shape -->
  <polygon points="460,250 460,160 580,160 580,155 610,150 640,140 660,135 680,130 720,130 720,250" fill="#c8d8ec" stroke="#1a1a2e" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Gradient highlight -->
  <line x1="580" y1="160" x2="680" y2="130" stroke="#1a73e8" stroke-width="3"/>

  <!-- 3:1 slope annotation -->
  <line x1="600" y1="170" x2="690" y2="170" stroke="#1a73e8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="170" x2="600" y2="148" stroke="#1a73e8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="650" y="185" text-anchor="middle" fill="#1a73e8" font-size="12" font-weight="700">3</text>
  <text x="588" y="162" text-anchor="middle" fill="#1a73e8" font-size="12" font-weight="700">1</text>

  <!-- Dimension labels -->
  <line x1="445" y1="160" x2="445" y2="250" stroke="#666" stroke-width="1"/>
  <line x1="440" y1="160" x2="450" y2="160" stroke="#666" stroke-width="1"/>
  <line x1="440" y1="250" x2="450" y2="250" stroke="#666" stroke-width="1"/>
  <text x="435" y="210" text-anchor="middle" fill="#666" font-size="12" font-weight="600" transform="rotate(-90,435,210)">얇음</text>

  <line x1="735" y1="130" x2="735" y2="250" stroke="#666" stroke-width="1"/>
  <line x1="730" y1="130" x2="740" y2="130" stroke="#666" stroke-width="1"/>
  <line x1="730" y1="250" x2="740" y2="250" stroke="#666" stroke-width="1"/>
  <text x="750" y="195" text-anchor="middle" fill="#666" font-size="12" font-weight="600" transform="rotate(90,750,195)">두꺼움</text>

  <!-- Good annotation -->
  <text x="590" y="280" text-anchor="middle" fill="#1a73e8" font-size="13" font-weight="700">균일한 냉각 → 수축 최소화</text>
</svg>