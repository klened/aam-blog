  <path d="M410 367 H422" stroke="#8ca0a7" stroke-width="5" stroke-linecap="round"/>
  <path d="M790 367 H802" stroke="#8ca0a7" stroke-width="5" stroke-linecap="round"/>
  <text x="600" y="635" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="19" font-weight="700" fill="#51666e">3가지 답을 같은 조건으로 받아야 제작 방식과 업체를 비교할 수 있습니다</text>
