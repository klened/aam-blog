    <line x1="65" y1="250" x2="265" y2="250" stroke="#d8e4e8" stroke-width="2"/>
    <text x="165" y="295" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="21" fill="#354a52">형상 · 소재 · 하중</text>
    <text x="165" y="333" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="21" fill="#354a52">온도 · 공차 · 승인 조건</text>
