    <circle cx="143" cy="106" r="8" fill="#015d75"/>
    <circle cx="187" cy="106" r="8" fill="#015d75"/>
    <path d="M148 135 L161 148 L187 122" fill="none" stroke="#2c8a52" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
