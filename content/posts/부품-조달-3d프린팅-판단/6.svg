    <line x1="65" y1="250" x2="265" y2="250" stroke="#d8e6dc" stroke-width="2"/>
    <text x="165" y="295" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="21" fill="#3e5043">파일 검토 · 시험 출력</text>
    <text x="165" y="333" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="21" fill="#3e5043">검수 · 배송 일정</text>
    <rect x="88" y="365" width="154" height="38" rx="19" fill="#e9f5ec"/>
    <text x="165" y="391" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="17" font-weight="700" fill="#245c2d">사용 가능일</text>
