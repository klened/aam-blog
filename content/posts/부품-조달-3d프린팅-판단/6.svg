    <circle cx="194" cy="121" r="4" fill="#bd5a0b"/><circle cx="216" cy="121" r="4" fill="#bd5a0b"/>
    <circle cx="194" cy="142" r="4" fill="#bd5a0b"/><circle cx="216" cy="142" r="4" fill="#bd5a0b"/>
