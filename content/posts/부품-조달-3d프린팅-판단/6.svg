    <circle cx="165" cy="110" r="62" fill="#fff1df"/>
    <ellipse cx="148" cy="90" rx="40" ry="17" fill="none" stroke="#bd5a0b" stroke-width="8"/>
    <path d="M108 90 V132 C108 142 126 150 148 150 C170 150 188 142 188 132 V90" fill="none" stroke="#bd5a0b" stroke-width="8"/>
