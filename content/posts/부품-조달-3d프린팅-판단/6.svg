<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">3D프린팅 견적에서 확인할 3가지</title>
  <desc id="desc">제작 가능 여부, 총비용, 실제 사용 가능일을 함께 확인하는 도식</desc>
  <rect width="1200" height="675" rx="28" fill="#f7fafb"/>
  <text x="600" y="72" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="34" font-weight="800" fill="#17313a">견적 전에 3가지를 한 번에 확인합니다</text>
  <text x="600" y="112" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" fill="#60737a">출력 가능 여부만 확인하면 비용과 실제 납품일을 놓칠 수 있습니다</text>

  <g transform="translate(55 155)">
    <rect width="330" height="425" rx="22" fill="#ffffff" stroke="#8bbcca" stroke-width="3"/>
