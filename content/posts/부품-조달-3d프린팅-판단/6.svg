    <line x1="138" y1="60" x2="138" y2="82" stroke="#297a38" stroke-width="8" stroke-linecap="round"/>
    <line x1="192" y1="60" x2="192" y2="82" stroke="#297a38" stroke-width="8" stroke-linecap="round"/>
